services:
  gttool:
    # Pull-then-build convention (matches splatograph/splatograph-orbslam3's
    # compose files in this project's ecosystem): try the pushed registry
    # image first, only fall back to a local from-source build (`build:`
    # below, or explicit `docker compose build`/`--build`) if the pull
    # fails or the image tag isn't resolvable. `pull_policy: missing` means
    # "pull only if not already present locally" -- avoids re-pulling this
    # ~31GB image (COLMAP 4.1.1 built from source, see docker/Dockerfile)
    # on every run once it's cached, while still getting the maintained
    # image by default instead of silently reusing a stale local build.
    image: ${COLMAP_RGBD_GT_IMAGE:-ghcr.io/bjoernellens1/colmap-rgbd-gt:latest}
    pull_policy: missing
    build:
      context: ..
      dockerfile: docker/Dockerfile
    # FIXED 2026-08-03: was ./workspaces (repo-root-relative), which didn't
    # match this project's own documented convention -- the README's Quick
    # Start example (`gttool full data/raw/session01.bag ...`) produces
    # `data/workspaces/session01/...` by default (CLI's own workspace
    # default is `bag_path.with_suffix("")`, not a fixed root, but
    # `data/raw/<bag>` -> `data/workspaces/<bag>` is the convention every
    # real scene run this project has actually used). The old mount silently
    # pointed `docker compose run` at a DIFFERENT, empty directory than
    # where `gttool` invoked directly (without compose) was actually
    # writing -- real scenes ended up split across both `workspaces/` and
    # `data/workspaces/` with no principled reason, found and consolidated
    # into `data/workspaces/` this session.
    volumes:
      - ./data/workspaces:/app/workspaces
      - /mnt/cps_persistent1_shared/datasets/public:/mnt/datasets/public:ro
    devices:
      - /dev/kfd
      - /dev/dri
    group_add:
      - video
    command: ["--help"]

  dev:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dev
    # FIXED 2026-08-03: was ./workspaces (repo-root-relative), which didn't
    # match this project's own documented convention -- the README's Quick
    # Start example (`gttool full data/raw/session01.bag ...`) produces
    # `data/workspaces/session01/...` by default (CLI's own workspace
    # default is `bag_path.with_suffix("")`, not a fixed root, but
    # `data/raw/<bag>` -> `data/workspaces/<bag>` is the convention every
    # real scene run this project has actually used). The old mount silently
    # pointed `docker compose run` at a DIFFERENT, empty directory than
    # where `gttool` invoked directly (without compose) was actually
    # writing -- real scenes ended up split across both `workspaces/` and
    # `data/workspaces/` with no principled reason, found and consolidated
    # into `data/workspaces/` this session.
    volumes:
      - ./data/workspaces:/app/workspaces
      - /mnt/cps_persistent1_shared/datasets/public:/mnt/datasets/public:ro
    devices:
      - /dev/kfd
      - /dev/dri
    group_add:
      - video
    working_dir: /app
    stdin_open: true
    tty: true
    entrypoint: ["/bin/bash"]
