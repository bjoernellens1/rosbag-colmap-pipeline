bag:
  path: ""
  storage_id: auto

topics:
  rgb: null
  rgb_compressed: null
  depth: null
  pointcloud: null
  camera_info: null
  # Depth camera's own camera_info topic (may differ from the color
  # `camera_info` above). Only needed for depth.registration below; left
  # unresolved (no fallback guess) when a bag has no depth-namespaced
  # camera_info topic of its own -- see topic_discovery.select_best_topics.
  depth_camera_info: null

sync:
  max_rgb_depth_dt_sec: 0.03
  max_rgb_info_dt_sec: 0.1

images:
  export_format: png
  min_frame_stride: 1
  max_frames: null

depth:
  unit_scale_to_meters: 0.001
  min_depth_m: 0.2
  max_depth_m: 8.0
  sample_stride: 8
  # Depth-to-color pixel registration: OFF by default. Some RGB-D drivers
  # publish a "raw" depth stream that is NOT actually pixel-aligned with
  # color despite camera_info metadata suggesting otherwise (verified on
  # kitchen1 -- see configs/orbbec_kitchen1_registered.yaml and
  # ingest/depth_registration.py's module docstring for the evidence).
  # Enabling this warps every depth frame into the color camera's pixel
  # grid at extraction time using the /tf_static depth->color extrinsic,
  # which changes per-pixel depth values throughout the whole downstream
  # pipeline -- only turn on for a scene independently verified to need
  # it. Leave disabled for scenes already using a hardware-aligned depth
  # stream (e.g. tableware1's /camera/aligned_depth_to_color/...).
  registration:
    enabled: false
    # Physically-real TF frame ids used to look up the depth->color static
    # extrinsic in /tf_static -- NOT necessarily the frame_id string the
    # depth camera_info topic itself claims (that field can be
    # driver-mislabeled; see ingest/depth_registration.py).
    depth_frame_id: camera_depth_optical_frame
    color_frame_id: camera_color_optical_frame

colmap:
  camera_model: OPENCV
  single_camera: true
  matcher: sequential
  use_gpu: false
  mapper_preset: medium
  # global (colmap global_mapper) is also the code-level default
  # (colmap/runner.py::run_full_pipeline) as of 2026-08-02 -- listed
  # explicitly here too for visibility. See runner.py's
  # global_mapper()/run_full_pipeline() comments for the kitchen1/hallway
  # comparison that motivated the flip. Set to "incremental" to opt back
  # into colmap mapper for a scene that specifically needs it.
  mapper_type: global

scaling:
  method: umeyama
  max_frames_for_scale: 100
  min_points_per_frame: 200
  outlier_rejection: ransac
  robust_statistic: median

depth_ba:
  enabled: true
  depth_tolerance: 0.1
  obs_sigma_base: 0.01
  obs_sigma_quadratic: 0.0
  max_iterations: 50
  max_frames_for_ba: 100

export:
  tum: true
  csv: true
  json_report: true
