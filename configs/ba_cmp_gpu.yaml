bag:
  path: ""
  storage_id: auto

topics:
  rgb: /camera/rgb/image_raw
  rgb_compressed: /camera/rgb/image_raw/compressed
  depth: /camera/depth/image_raw
  pointcloud: null
  camera_info: /camera/rgb/camera_info

sync:
  max_rgb_depth_dt_sec: 0.02
  max_rgb_info_dt_sec: 0.05

images:
  export_format: png
  min_frame_stride: 1
  max_frames: null

depth:
  unit_scale_to_meters: 0.001
  min_depth_m: 0.3
  max_depth_m: 10.0
  sample_stride: 4

colmap:
  camera_model: OPENCV
  single_camera: true
  matcher: sequential
  use_gpu: true
  mapper_preset: medium
  run_bundle_adjustment: true
  ba_backend: caspar

scaling:
  method: umeyama
  max_frames_for_scale: 150
  min_points_per_frame: 300
  outlier_rejection: ransac

export:
  tum: true
  csv: true
  json_report: true
